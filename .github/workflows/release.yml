name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  IMAGE_NAME: gosh-memory

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            runner: ubuntu-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and export
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${IMAGE_NAME}-v${VERSION}-${{ matrix.suffix }}.tar"

          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f docker/Dockerfile \
            -t "${IMAGE_NAME}:${VERSION}" \
            -t "${IMAGE_NAME}:latest" \
            --output "type=docker,dest=${ARTIFACT}" \
            .

          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
          echo "ARTIFACT=${ARTIFACT}" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=${ARTIFACT}.sha256" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.CHECKSUM_FILE }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate manifest.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Collect checksums
          declare -A CHECKSUMS
          declare -A ARCHIVES
          for sha_file in artifacts/*.sha256; do
            hash=$(awk '{print $1}' "$sha_file")
            archive=$(awk '{print $2}' "$sha_file")
            # Extract suffix: gosh-memory-v0.1.0-amd64.tar → amd64
            suffix=$(echo "$archive" | sed -E 's/.*-([^-]+)\.tar$/\1/')
            CHECKSUMS["$suffix"]="$hash"
            ARCHIVES["$suffix"]="$archive"
          done

          cat > artifacts/manifest.json <<MANIFEST
          {
            "version": "${VERSION}",
            "format_version": 1,
            "artifacts": {
              "amd64": {
                "sha256": "${CHECKSUMS[amd64]}",
                "archive": "${ARCHIVES[amd64]}"
              },
              "arm64": {
                "sha256": "${CHECKSUMS[arm64]}",
                "archive": "${ARCHIVES[arm64]}"
              }
            }
          }
          MANIFEST

          python3 -m json.tool artifacts/manifest.json > artifacts/manifest_pretty.json \
            && mv artifacts/manifest_pretty.json artifacts/manifest.json

          echo "Generated manifest.json:"
          cat artifacts/manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
