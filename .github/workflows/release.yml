name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Python package artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel

      - name: Generate artifact manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', pyproject)
          if not match:
              raise SystemExit("FATAL: could not read project version")
          version = match.group(1)

          artifacts = {}
          for path in sorted(Path("dist").iterdir()):
              if path.name == "manifest.json" or path.suffix == ".sha256":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              sha_path = path.with_name(f"{path.name}.sha256")
              sha_path.write_text(f"{digest}  {path.name}\n", encoding="utf-8")
              artifacts[path.name] = {"sha256": digest}

          manifest = {
              "version": version,
              "format_version": 1,
              "artifacts": artifacts,
          }
          Path("dist/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
